name: Screenshot check

on:
  push:
    branches: [native, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/screens.sh
      - name: Save screenshots to the screens branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots /tmp/out/ 2>/dev/null || true
          git config user.name "Chitranjan Sharma"
          git config user.email "sharmachitranjan-Chit@users.noreply.github.com"
          git checkout --orphan screens
          git rm -rf -q . || true
          cp -r /tmp/out/shots . 2>/dev/null || mkdir shots
          git add shots
          git commit -q -m "Screenshots of ${GITHUB_SHA::7}" || true
          git push -f origin screens
