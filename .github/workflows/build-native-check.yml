name: Check native build

on:
  push:
    branches: [native]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |What went wrong|^> |Could not|error:|Unresolved|not found" -A4 build.log | head -120 | sed 's/%/%25/g')
          msg="${msg//$'\r'/}"
          echo "::error title=Gradle::${msg//$'\n'/%0A}"
      - name: APK size
        run: ls -la app/build/outputs/apk/release/
