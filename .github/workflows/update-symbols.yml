name: Update stock list

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # every day, 8:00 AM IST

permissions:
  contents: write
  actions: write   # to start the APK build after the list changes

jobs:
  symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download NSE and BSE company lists
        run: |
          node scripts/build-symbols.mjs
          node scripts/build-sectors.mjs
      - name: Save if changed
        id: save
        run: |
          git config user.name "Chitranjan Sharma"
          git config user.email "sharmachitranjan-Chit@users.noreply.github.com"
          git add app/src/main/assets/symbols.json app/src/main/assets/sectors.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update NSE and BSE company list"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A push made with the workflow token does not start other workflows, so start the APK build by hand.
      - name: Build a new APK with the updated list
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref "${{ github.ref_name }}"
