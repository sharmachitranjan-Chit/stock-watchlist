name: Build and release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'engine/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/screens.yml'
      - '.github/workflows/update-symbols.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${{ github.run_number }}"
          FILE="Watchlist-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Watchlist ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            ${{ github.event.head_commit.message }}

            Install: download the APK below on your phone and open it. It installs over the previous version and keeps your lists.
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
