name: Build and release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'engine/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build${{ github.run_number }}"
          FILE="Watchlist-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Watchlist ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            ${{ github.event.head_commit.message }}

            Install: download the APK below on your phone and open it. It installs over the previous version and keeps your lists.
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
